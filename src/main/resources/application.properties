# Java Spring
spring.application.name=movie-roulette-api
spring.datasource.url=jdbc:mysql://localhost:3306/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.cache.type=caffeine
spring.cache.cache-names=tmdbGenres
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=24h

# TMDB
tmdb.base-url=https://api.themoviedb.org/3
tmdb.access-token=${TMDB_ACCESS_TOKEN}
tmdb.connect-timeout=3s
tmdb.read-timeout=5s
tmdb.image-base-url=https://image.tmdb.org/t/p
tmdb.poster-size=w500
